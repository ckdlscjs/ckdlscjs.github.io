projects:
  # ==========================================
  # 01. DX11 기반 ECS 아키텍처 렌더러
  # ==========================================
  - id: project-01
    name: "DirectX11 기반 ECS 아키텍처 렌더러"
    category: personal
    featured: true
    technology: "C++17 / DirectX11 / HLSL / ECS / ImGui"
    period: "2025.05 ~ 진행 중"
    role: "개인 프로젝트 · 엔진 아키텍처 및 렌더링 시스템 전체 설계·구현"
    image: ""

    summary: >-
      DirectX11과 C++17을 기반으로 게임 엔진의 핵심 시스템과
      3D 렌더링 파이프라인을 직접 구현한 개인 프로젝트입니다.
      기존 OOP 기반 렌더러에서 경험한 메모리 파편화와
      렌더링 상태 변경 오버헤드를 개선하기 위해
      데이터 지향 ECS 아키텍처와
      64비트 정렬 키 기반 렌더링 파이프라인을 설계했습니다.
      리소스 관리부터 충돌·피킹, 렌더패스 및
      인스턴싱 배치 처리까지 단계적으로 구조를 개선했습니다.

    highlights:
      - "엔진 아키텍처 및 리소스 시스템 — CRTP 기반 시스템 관리, RAII 및 D3D11 Wrapper, FNV-1a 해시 기반 리소스 캐싱"
      - "DOD 기반 ECS — Archetype/Bitset, 16KB Chunk, Sparse/Dense Lookup 및 Swap & Pop 기반 엔티티 관리"
      - "Render Queue 최적화 — 64비트 정렬 키 기반 렌더패스 분류, Instancing 배칭, XOR 비교를 활용한 Lazy Binding"
      - "그래픽스 파이프라인 — Deferred Shading(MRT/G-Buffer), PCF Shadow Mapping, Cubemap 및 Outline Pass"
      - "가시성 및 충돌 처리 — Frustum Culling, 경계 볼륨 판정, Compute Shader 기반 스키닝 및 Triangle Picking"

    github: "https://github.com/ckdlscjs/c_cpp"
    document: ""
    video: ""

  # ==========================================
  # 02. LoLShinSouls & MapTool
  # ==========================================
  - id: project-02
    name: "LoLShinSouls & MapTool"
    category: team
    featured: true
    technology: "C++11 / DirectX11 / HLSL / FBX SDK / FMOD"
    period: "2023.03 ~ 2023.05"
    role: "3인 팀 프로젝트 · 팀장 / MapTool / UI 시스템"
    image: ""

    summary: >-
      DirectX11과 C++11 기반 자체 렌더링 프레임워크를 활용하여
      3D 액션 RPG 게임과 전용 맵 에디터를 제작한 팀 프로젝트입니다.
      지형 편집과 에셋 배치, 씬 직렬화 기능을 갖춘
      MapTool을 개발하고, 생성된 월드 데이터를
      게임 클라이언트에서 복원하도록 구성했습니다.
      게임 내 카메라, UI 및 미니맵 시스템을 담당했으며,
      공간 분할과 인스턴싱을 활용해 렌더링 효율을 개선했습니다.

    highlights:
      - "DX11 렌더링 프레임워크 — 엔진 생명주기 관리, FBX SDK 기반 에셋 파싱 및 리소스 캐싱"
      - "MapTool 및 지형 편집 — Quadtree 기반 공간 분할, Sculpting, RGBA 마스크 기반 4중 Splatting"
      - "맵 데이터 파이프라인 — 에셋·충돌체·스폰 포인트·카메라 경로의 직렬화 및 게임 클라이언트 역직렬화"
      - "렌더링 최적화 — Frustum Culling, Foliage Instancing 및 DrawIndexedInstanced 기반 식생 배치"
      - "게임 클라이언트 시스템 — SpringArm 카메라 충돌 회피, Bezier/Perlin Noise 연출, 계층형 UI 및 RTT 미니맵"

    github: "https://github.com/ckdlscjs/TeamProject"
    document: ""
    video: ""

  # ==========================================
  # 03. TheBattleFront
  # ==========================================
  - id: project-03
    name: "TheBattleFront"
    category: team
    featured: true
    technology: "C++ / Unreal Engine 5.1 / IOCP / Perforce"
    period: "2024.04 ~ 2024.06"
    role: "3인 팀 프로젝트 · 팀장 / Map / AI 시스템"
    image: ""

    summary: >-
      Unreal Engine 5.1과 C++를 활용하여 제작한
      쿼터뷰 실시간 멀티플레이 전투 게임입니다.
      외부 IOCP 서버와의 패킷 송수신을 클라이언트 시스템에
      연결하여 플레이어·AI·맵 상호작용 상태를 동기화했습니다.
      BehaviorTree와 EQS 기반 AI 행동 시스템,
      게임 레벨 및 상호작용 기능을 구현했으며,
      포스트 프로세싱을 이용한 시각 효과와
      미니맵·카메라 연출을 구성했습니다.

    highlights:
      - "멀티플레이 상태 동기화 — IOCP 서버 패킷 연동, GameMode 기반 액터 상태 갱신 및 Transform 보간"
      - "AI 행동 시스템 — BehaviorTree/Blackboard, AI Perception, EQS 기반 엄폐 위치 탐색 및 Spline 경로 이동"
      - "게임 레벨 및 상호작용 — Landscape, 적 스폰 시스템, 자기장 축소, 수풀 및 아이템 상호작용"
      - "그래픽스 및 시각 효과 — CustomDepth/Stencil 기반 Sobel Outline, Dissolve Material 및 시야 안개"
      - "카메라·협업 시스템 — SceneCapture2D 미니맵, Cinematic Camera 및 Perforce(P4D) 협업 환경 구축"

    github: "https://github.com/ckdlscjs/BattleFront"
