  about:
    - title: "About Me"
      text: |-
        **무엇인가를 만드는 삶, 원하는 것을 따라 하고 자기 방식대로 고쳐 보면서 만족할 만한 결과물을 얻는 과정에서 즐거움을 느끼는 사람**

        만드는 행위를 제외한다면 스스로를 설명하기 어렵습니다. 저에게 자유시간이란 원하는 무엇인가를 꾸준히 만들어 볼 수 있는 즐거운 시간이었습니다.

        친구들이 취미로 게임, 축구, 독서, 노래 등 여러 가지를 즐길 때, 저에게 취미란 손으로 무엇인가를 만들고 그 과정과 결과물에서 만족감을 얻는 것이었습니다.

        어릴 적부터 모형 조립을 즐겼지만 단순한 제품 조립에 그치지 않고, 모형 공방을 이용하거나 방에 도색 부스를 설치하고 전동 공구를 이용해 직접 가공하고 개조하기도 했습니다. 게임 속 캐릭터의 외형 데이터를 직접 만들 수 있다는 이야기를 듣고, 그것을 해보고 싶어서 게임을 시작한 적도 있었습니다.

        대학생 시절에는 기계식 키보드에 관심을 가지면서 아직 대중화되지 않았던 커스텀 키보드 커뮤니티에서 활동하며 도면 제작과 납땜, 부품 교체 등을 경험했습니다. 이후 시계에 관심을 가지면서는 사용할 시곗줄이 너무 비싸다는 생각에 가죽공예를 시작했고, 시계를 직접 수리해 보려고 분해하고 조립하기도 했습니다.

        이처럼 제 취미는 하나의 관심에서 시작해 새로운 분야로 이어지는 경우가 많았습니다. 그 과정에서 쌓아 온 지식과 경험은 단순히 취미를 즐긴 시간이 아니라, 지금의 저를 이루는 중요한 부분이라고 생각합니다.

        이런 제게 개발이란 앞서 거쳐 온 과정의 연속선상에 있습니다. 원하는 바를 이루기 위해 필요한 기술을 익혀 나가는 과정에 있으며, 취미이자 업무로서 이를 이어 나가고자 합니다.

      images:
        - src: "/assets/images/figure.jpg"
          caption: ""

    - title: "호기심과 도전"
      text: |-
        **관심이 생긴 일은 단순한 경험에 그치지 않고 스스로 어디까지 해낼 수 있는가를 확인해 봅니다.**

        무엇인가에 관심이 생기면 남들이 해놓은 결과물을 보고 만족하기보다, 직접 해보면서 제가 할 수 있는 범위를 확인하고 싶어집니다.

        사용하던 전자제품이 고장 나면 필요한 도구를 구하고 인터넷 등에서 정보를 찾아 직접 납땜이나 정비, 부품 교체 등을 시도했습니다. 시계 역시 작동하지 않거나 교체할 부분이 생기면 직접 분해하고 재조립했으며, 필요한 부품을 해외 사이트에서 주문하거나 공업사에 가공을 맡기는 등 여러 방법을 찾아보았습니다.

        이러한 과정에서 예상하지 못한 문제에 부딪히기도 했지만, 해결 방법을 찾아 하나씩 시도해 보는 일 자체가 제게는 호기심과 즐거움으로 느껴졌습니다.

        물론 모든 도전이 성공으로 이어지지는 않았습니다. 하지만 처음 접하는 분야라고 포기하기보다는 직접 부딪혀 보고, 그 과정에서 얻은 경험과 개인적인 노하우를 쌓는 것이 중요하다고 생각합니다.

        누구나 찾아볼 수 있는 정보도 유용하지만, 실제로 시행착오를 겪으며 몸으로 익힌 경험은 쉽게 얻을 수 없는 자신만의 지식이 된다고 생각합니다. 이러한 경험들이 새로운 일을 시작할 때 주저하기보다 먼저 시도해 볼 수 있는 밑거름이 되었습니다.

      images:
        - src: "/assets/images/keyboard.png"
          caption: ""
        - src: "/assets/images/watch.jpg"
          caption: ""

    - title: "퀄리티에 대한 나만의 기준"
      text: |-
        **제게 만드는 행위의 결과물은 단순히 완성에서 끝나지 않고 타인에게도 만족을 주는 제작의 연속입니다.**

        어릴 때 친구의 권유로 시작한 '겟앰프드'라는 게임에서의 스킨 데이터 제작은 15년 이상 지속해 온 취미입니다. 처음에는 제가 원하는 캐릭터를 만드는 데 그쳤지만, 여러 사람에게 관심을 받고 스스로의 실력을 갈고닦는 것에 즐거움을 느꼈습니다.

        시간이 지나면서 다른 사람에게 주문 제작을 받기도 했고, 오랫동안 만들어 온 제 작업물이 다른 사람들이 원하는 작품으로 인정받는 데 만족감을 느꼈습니다.

        시계 취미에서 시작한 가죽공예도 비슷했습니다. 처음에는 제가 사용할 시곗줄을 직접 만들기 위해 시작했지만, 여러 종류의 가죽을 다뤄 보고 제작 기술을 익히면서 주변 지인이나 다른 사람들에게 주문을 받아 제작하기도 했습니다.

        이러한 경험을 통해 제가 만든 결과물에 다른 사람이 기꺼이 비용을 지불한다는 것은 단순히 금전적인 보상을 받는 것 이상의 의미가 있다고 느꼈습니다. 제가 들인 시간과 노력이 타인에게도 만족을 줄 수 있는 결과물로 인정받았다는 사실이 좋았기 때문입니다.

        그래서 제가 잘 알고 있는 분야일수록 완성도에 대한 기준이 높은 편입니다. 제 눈에 부족한 부분이 보이면 이미 완성한 작업이라도 다시 손보게 되고, 작은 부분이라도 마음에 걸리면 쉽게 넘어가지 못합니다.

        이런 제게 무엇인가를 만든다는 것은 단순히 완성했다는 사실에 만족하는 것이 아니라, 적어도 제가 잘 알고 있는 분야에서는 스스로에게도, 다른 사람에게도 책잡히지 않을 만큼 만족스러운 결과물을 만들어 내는 일이라고 생각합니다.

      images:
        - src: "/assets/images/getskin.png"
          caption: ""
        - src: "/assets/images/strap.png"
          caption: ""

    - title: "관계와 소통, 그리고 협력"
      text: |-
        **사람들과의 관계에서 신뢰를 중요하게 생각하고, 남에게 먼저 도움을 줄 수 있는 사람이 되고자 합니다.**

        오랜 지인들에게서 저는 재주가 많고 의리가 두터운 사람이라고 이야기되곤 합니다. 주변에서 무언가 고장 나거나 바꿔야 할 일이 있다면 제가 알고 있는 부분에 대해서는 부탁하지 않더라도 먼저 선뜻 도와주려고 나서곤 했습니다.

        그 과정이 제게 즐거움을 주기도 하고, 제가 할 수 있는 일로 가까운 사람에게 도움이 된다는 사실 자체가 좋았기 때문입니다.

        여럿이서 어떤 일을 같이 해야 할 때 누군가 나서지 않는다면 먼저 의견을 제시하곤 합니다. 대학교 시절부터 학원 과정에 이르기까지 수차례 자발적으로 팀장을 맡았던 것도 이러한 성향과 관련이 있습니다.

        하지만 한 사람이 중심에 서서 일을 이끌어 가는 것만으로는 미처 발견하지 못하는 문제나 부족한 부분이 생길 수 있다고 생각합니다. 앞서 이야기한 만족할 만한 결과물을 만들기 위해서는 자신의 의견을 가감 없이 제시하는 것뿐 아니라 다른 사람의 의견을 받아들이는 것 역시 중요합니다.

        그래서 제 시야에서만 판단하기보다는 팀원들의 의견을 수렴하고, 제가 발견하지 못한 부분은 다른 사람의 도움을 받으면서 함께 결과물을 만들어 가려고 했습니다. 이러한 방식이 저 자신에게도, 함께하는 사람들에게도 더 좋은 결과를 이끌어 내는 합리적인 방법이라고 생각했기 때문입니다.

        이처럼 서로 믿고 필요한 순간에 먼저 손을 내밀 수 있는 관계를 오래 이어 가고 싶습니다.

    - title: "성장과 책임감"
      text: |-
        **관심사에 깊이 몰두하는 것은 장점이지만, 우선순위에 대한 사리 분별은 앞으로의 큰 개선점입니다.**

        제게 관심이 있는 일이라면 시간과 노력을 아끼지 않았습니다. 결과를 위해서라는 명목하에 그 과정에서 소비되는 시간이나 낭비를 크게 고려하지 않았고, 이러한 성향이 좋은 결과로 이어지기도 했습니다.

        하지만 시간이 흐르면서 무언가에 몰두하는 것과 일을 올바른 순서로 해내는 것은 별개의 문제라는 사실을 느꼈습니다.

        해야 할 일보다 하고 싶은 일을 먼저 선택하는 경우가 많았고, 이는 비효율적인 시간 투자로 이어지기도 했습니다. 지금 돌아보면 당장 하고 싶은 일에 집중하느라 정작 중요한 일에 대한 위기의식이 부족했던 때도 있었다고 생각합니다.

        지금도 완성도에 대한 깐깐함은 중요하게 생각하지만, 그런 결과를 얻기 위해 무엇을 희생하고 있는지, 지금 먼저 해야 할 일이 무엇인지도 함께 고려하고 개선하고자 합니다.

        제가 바라는 것은 이러한 노력이 무조건적인 보상으로 돌아오는 것만은 아닙니다. 제가 맡은 일에서 제 몫을 해내고, 주변 사람들에게 신뢰를 주며, 좋아하는 일을 꾸준히 이어 나갈 수 있는 삶을 살고 싶습니다.

        그동안 여러 분야에서 발휘했던 추진력을 앞으로는 더 중요한 목표에 집중하면서, 해내고자 하는 일을 책임 있게 마무리하는 사람이 되고 싶습니다.

