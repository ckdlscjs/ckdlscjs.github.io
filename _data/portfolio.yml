  # ==========================================
  # ABOUT ME — 사진 경로는 실제 업로드한 파일명으로 변경
  # ==========================================
  about:
    - title: "About Me"
      text: |-
        **저는 무언가에 관심이 생기면 직접 만들어 보거나, 제 방식대로 고쳐 보면서 만족할 만한 결과물을 얻는 과정에서 즐거움을 느끼는 사람입니다.**

        어릴 적부터 조립이나 제작에 관련된 취미를 꾸준히 이어왔습니다. 프라모델을 조립하다가 도색과 가공까지 해보게 되었고, 기계식 키보드에 관심이 생겼을 때는 오래된 제품을 구해 직접 납땜하거나 개조하기도 했습니다. 시계를 수집하다가 수리와 분해까지 관심이 이어졌고, 마음에 드는 가죽 시곗줄이 비싸다는 이유로 시작했던 가죽공예는 주변 사람들에게 주문을 받아 제작할 수 있을 정도까지 계속하게 되었습니다.

        처음부터 전문적인 지식이 있었던 것은 아니지만 궁금한 부분이 있으면 자료를 찾아보고 필요한 도구를 구해 직접 해보는 편이었습니다. 개발 역시 그런 관심이 이어진 분야 중 하나로, 배운 것을 활용해 머릿속으로 생각했던 결과물을 실제로 만들어 낼 수 있다는 점이 즐겁습니다.
      images:
        - src: "/assets/images/figure.jpg"
          caption: ""
    - title: "호기심과 도전"
      text: |-
        **저는 관심이 생긴 일을 단순히 경험해 보는 정도에서 끝내기보다, 제가 할 수 있는 범위가 어디까지인지 직접 확인해 보고 싶어 하는 편입니다.**

        키보드를 수집하다가 직접 수리하기 시작했고, 시계도 단순히 착용하거나 수집하는 것을 넘어 분해와 정비를 시도했습니다. 필요한 부품을 해외에서 구하거나 직접 만들기 어려운 부품을 가공 업체에 맡기는 등 원하는 결과를 얻기 위해 여러 방법을 찾아보기도 했습니다.

        물론 모든 일을 전문적으로 잘할 수 있는 것은 아닙니다. 다만 처음 접하는 분야라고 해서 포기하기보다는 필요한 정보를 찾아보고 직접 해보면서 제 나름의 방법을 익힙니다. 책이나 자료로 얻는 지식도 중요하지만, 실제로 부딪혀 보지 않으면 알 수 없는 부분이 많다고 생각합니다.
      images:
        - src: "/assets/images/keyboard.png"  # 실제 파일명 확인
          caption: ""
        - src: "/assets/images/watch.jpg"  # 실제 파일명 확인
          caption: ""

    - title: "퀄리티에 대한 나만의 기준"
      text: |-
        **제가 생각하는 결과물의 완성도는 단순히 형태를 갖춘 수준이 아니라, 다른 사람도 그 가치를 인정할 수 있는 정도에 도달하는 것입니다.**

        초등학생 때 친구의 권유로 시작한 겟앰프드라는 게임에서의 스킨데이터 제작은 15년 넘게 이어온 취미입니다. 처음에는 제가 원하는 캐릭터를 만드는 것이 즐거웠지만, 시간이 지나면서 제작한 스킨을 다른 사람에게 판매하기도 했고 커뮤니티에서 제 작업물을 알아봐 주는 사람들도 생겼습니다. 가죽공예도 처음에는 제가 사용할 시곗줄을 만들기 위해 시작했지만, 나중에는 주변 지인과 커뮤니티에서 주문을 받아 제작하게 되었습니다.

        다른 사람이 제가 만든 결과물에 기꺼이 비용을 지불한다는 것은 단순한 금전적인 보상 이상의 의미가 있습니다. 제 눈에 부족한 부분이 보이면 계속 신경이 쓰이고 이미 완성한 작업도 다시 손보는 경우가 많지만, 적어도 제가 잘 알고 있는 분야에서는 스스로 만족할 수 있는 기준을 지키고 싶습니다.
      images:
        - src: "/assets/images/getskin.png"
          caption: ""
        - src: "/assets/images/strap.png"  # 실제 파일명 확인
          caption: ""

    - title: "관계와 소통"
      text: |-
        **저는 사람들과의 관계에서 서로에 대한 신뢰를 중요하게 생각하며, 제가 가진 능력으로 누군가에게 도움이 될 수 있다면 기꺼이 나서려고 하는 편입니다.**

        오래 알고 지낸 친구들이나 주변 사람들은 저를 재주가 많고 정이 많은 사람이라고 이야기하곤 합니다. 주변에서 물건이 고장 나거나 제가 알고 있는 분야에 도움이 필요한 일이 생기면 먼저 나서서 해결해 주려는 경우가 많았습니다. 특별한 대가를 바라기보다 제가 할 수 있는 일로 가까운 사람에게 도움이 된다는 사실 자체가 좋았기 때문입니다.

        여럿이 함께 결정해야 할 일이 생기면 제 의견을 비교적 적극적으로 이야기하는 편입니다. 그렇다고 항상 제가 중심에 서야 한다고 생각하지는 않으며, 서로 다른 의견 가운데 모두가 납득할 만한 방향을 찾는 일이 중요하다고 봅니다. 학교와 교육 과정의 팀 프로젝트에서도 자연스럽게 팀장을 맡았던 경험이 많았고, 가까운 사람들과는 서로 믿고 필요할 때 손을 내밀 수 있는 관계를 오래 이어가고 싶습니다.

    - title: "성장과 책임감"
      text: |-
        **한 가지 일에 깊이 몰두하는 것은 제 장점이지만, 그만큼 무엇을 먼저 해야 하는지 판단하는 것은 앞으로도 개선해야 할 부분이라고 생각합니다.**

        지금까지 저는 관심이 생긴 일이라면 시간이나 노력을 크게 아끼지 않았습니다. 원하는 결과가 나온다면 그 과정에 얼마나 오랜 시간이 걸리는지는 중요하게 생각하지 않았고, 실제로 여러 제작 취미에서 이러한 성향이 좋은 결과로 이어지기도 했습니다. 하지만 시간이 지나면서 무언가를 잘 만드는 능력과 삶에서 중요한 일을 올바른 순서로 해내는 것은 별개라는 사실도 느꼈습니다.

        예전에는 결과물이 좋다면 그 과정에 투자한 시간은 충분히 보상받을 수 있다고 생각했습니다. 지금도 완성도를 중요하게 여기지만 이제는 그 결과를 얻기 위해 무엇을 미루고 있는지, 지금 가장 먼저 해야 하는 일은 무엇인지도 함께 고민하려 합니다.

        제가 바라는 삶은 거창한 성공보다 맡은 일에서 제 몫을 해내고, 주변 사람들에게 신뢰를 주며, 좋아하는 일도 꾸준히 이어갈 수 있는 삶입니다. 앞으로는 그동안 여러 분야에서 보여줬던 추진력을 더 중요한 목표에 집중시키고, 해야 할 일을 책임 있게 마무리하는 사람이 되고 싶습니다.


