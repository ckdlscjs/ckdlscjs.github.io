  # ==========================================
  # 01. DirectX11 ECS Renderer
  # ==========================================
  - id: project-01
    name: "DirectX11 기반 ECS 아키텍처 렌더러"
    category: personal
    technology: "C++17 / DirectX11 / HLSL / ECS / ImGui"
    period: "2025.05 ~ 진행 중"
    role: "개인 프로젝트 · 엔진 아키텍처 및 렌더링 시스템 전체 설계·구현"
    image: ""
    summary: >-
      DirectX11과 C++17을 기반으로 게임 엔진의 핵심 시스템과
      3D 렌더링 파이프라인을 직접 구현한 개인 프로젝트입니다.
      기존 OOP 기반 렌더러에서 경험한 메모리 파편화와
      렌더링 상태 변경 오버헤드를 개선하기 위해
      데이터 지향 ECS 아키텍처와
      64비트 정렬 키 기반 렌더링 파이프라인을 설계했습니다.
      리소스 관리부터 충돌·피킹, 렌더패스 및
      인스턴싱 배치 처리까지 단계적으로 구조를 개선했습니다.
    highlights:
      - "엔진 아키텍처 및 리소스 시스템 — CRTP 기반 시스템 관리, RAII 및 D3D11 Wrapper, FNV-1a 해시 기반 리소스 캐싱"
      - "DOD 기반 ECS — Archetype/Bitset, 16KB Chunk, Sparse/Dense Lookup 및 Swap & Pop 기반 엔티티 관리"
      - "Render Queue 최적화 — 64비트 정렬 키 기반 렌더패스 분류, Instancing 배칭, XOR 비교를 활용한 Lazy Binding"
      - "그래픽스 파이프라인 — Deferred Shading(MRT/G-Buffer), PCF Shadow Mapping, Cubemap 및 Outline Pass"
      - "가시성 및 충돌 처리 — Frustum Culling, 경계 볼륨 판정, Compute Shader 기반 스키닝 및 Triangle Picking"
    github: "https://github.com/ckdlscjs/c_cpp"
    document: ""
    videos: []

